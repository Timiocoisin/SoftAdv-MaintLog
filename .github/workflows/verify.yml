name: verify

on:
  push:
  pull_request:

jobs:
  release-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release tables
        run: python verify_release_tables.py
